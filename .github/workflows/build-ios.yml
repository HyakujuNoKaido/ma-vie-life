name: Créer mon App iPhone (IPA)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      # 1. Préparation
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # 2. Build du site web
      - name: Installation et Build Web
        run: |
          npm install
          npm run build 

      # 3. Moteur Mobile & Génération d'Icônes
      - name: Ajout Mobile, Fix iOS et Icônes
        run: |
          # Installation des outils, y compris le générateur d'assets
          npm install @capacitor/core @capacitor/cli @capacitor/ios @capacitor/assets

          # Initialisation
          npx cap init "Ma Vie Life" "com.mavielife.app" --web-dir dist
          
          # Création du projet iOS (avec l'astuce anti-plantage)
          npx cap add ios || true
          
          # --- GÉNÉRATION DES ICÔNES ---
          # Si le dossier 'resources' et 'icon.png' existent, ça va créer les icônes iOS
          npx capacitor-assets generate --ios
          # -----------------------------

          # Correctif version iOS (sed)
          sed -i '' "s/platform :ios, .*/platform :ios, '16.0'/" ios/App/Podfile
          
          # Synchro finale
          npx cap update ios
          npx cap sync

      # 4. Compilation de l'App (IPA)
      - name: Construction de l'IPA
        run: |
          cd ios/App
          # Compilation forcée iOS 16.0
          xcodebuild -workspace App.xcworkspace -scheme App -configuration Release -archivePath App.xcarchive archive CODE_SIGNING_ALLOWED=NO IPHONEOS_DEPLOYMENT_TARGET=16.0
          
          cd App.xcarchive/Products/Applications
          mkdir Payload
          mv App.app Payload/
          zip -r MaVieLife.ipa Payload/

      # 5. Mise à disposition
      - name: Mettre l'IPA à disposition
        uses: actions/upload-artifact@v4
        with:
          name: Mon-Application-iPhone
          path: ios/App/App.xcarchive/Products/Applications/MaVieLife.ipa
