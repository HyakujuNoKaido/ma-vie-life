name: Créer mon App iPhone (IPA)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      # 1. Préparation de Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # 2. Build du site web
      - name: Installation et Build Web
        run: |
          npm install
          # Si ton script de build s'appelle autrement, change la ligne ci-dessous
          npm run build 

      # 3. Transformation en App iPhone (AVEC LE CORRECTIF DE VERSION)
      - name: Ajout du moteur Mobile et Correctif iOS
        run: |
          npm install @capacitor/core @capacitor/cli @capacitor/ios
          # On initialise le projet
          npx cap init "Ma Vie Life" "com.mavielife.app" --web-dir dist
          npx cap add ios
          
          # --- LE FIX EST ICI ---
          # On force le fichier de configuration (Podfile) à accepter iOS 15.0
          # Cela corrige l'erreur "higher minimum deployment target"
          sed -i '' "s/platform :ios, .*/platform :ios, '15.0'/" ios/App/Podfile
          # ----------------------

          npx cap sync

      # 4. Compilation de l'App (IPA)
      - name: Construction de l'IPA
        run: |
          cd ios/App
          # On force aussi Xcode à utiliser iOS 15 comme cible
          xcodebuild -workspace App.xcworkspace -scheme App -configuration Release -archivePath App.xcarchive archive CODE_SIGNING_ALLOWED=NO IPHONEOS_DEPLOYMENT_TARGET=15.0
          
          cd App.xcarchive/Products/Applications
          mkdir Payload
          mv App.app Payload/
          zip -r MaVieLife.ipa Payload/

      # 5. Mise à disposition du fichier
      - name: Mettre l'IPA à disposition
        uses: actions/upload-artifact@v4
        with:
          name: Mon-Application-iPhone
          path: ios/App/App.xcarchive/Products/Applications/MaVieLife.ipa
