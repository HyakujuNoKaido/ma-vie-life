name: Créer mon App iPhone (IPA)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      # 1. Préparation
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # 2. Build du site web
      - name: Installation et Build Web
        run: |
          npm install
          npm run build 

      # 3. Moteur Mobile (AVEC L'ASTUCE ANTI-PLANTAGE)
      - name: Ajout du moteur Mobile et Correctif iOS
        run: |
          npm install @capacitor/core @capacitor/cli @capacitor/ios
          npx cap init "Ma Vie Life" "com.mavielife.app" --web-dir dist
          
          # --- L'ASTUCE EST ICI ---
          # On lance la création du projet iOS.
          # Si ça plante à cause de la version (exit code 1), "|| true" dit à GitHub : "C'est pas grave, continue !"
          npx cap add ios || true
          
          # Maintenant que le dossier est créé, on applique le correctif
          # On force la version à iOS 16.0 (qui est compatible avec tout aujourd'hui)
          sed -i '' "s/platform :ios, .*/platform :ios, '16.0'/" ios/App/Podfile
          
          # On relance l'installation des dépendances (cette fois ça va marcher car on a corrigé le fichier)
          npx cap update ios
          npx cap sync

      # 4. Compilation de l'App (IPA)
      - name: Construction de l'IPA
        run: |
          cd ios/App
          # On compile en forçant la compatibilité iOS 16.0
          xcodebuild -workspace App.xcworkspace -scheme App -configuration Release -archivePath App.xcarchive archive CODE_SIGNING_ALLOWED=NO IPHONEOS_DEPLOYMENT_TARGET=16.0
          
          cd App.xcarchive/Products/Applications
          mkdir Payload
          mv App.app Payload/
          zip -r MaVieLife.ipa Payload/

      # 5. Mise à disposition du fichier
      - name: Mettre l'IPA à disposition
        uses: actions/upload-artifact@v4
        with:
          name: Mon-Application-iPhone
          path: ios/App/App.xcarchive/Products/Applications/MaVieLife.ipa
