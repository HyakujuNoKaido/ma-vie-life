<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LifeTrack</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      // Ce script capture les erreurs avant même qu'Angular ne se lance
      window.onerror = function(message, source, lineno, colno, error) {
        document.body.innerHTML = `
          <div style="background:red; color:white; padding:20px; font-size:20px;">
            <b>ERREUR DE CHARGEMENT :</b><br>
            ${message}<br><small>${source}:${lineno}</small>
          </div>`;
      };
      window.global = window;
    </script>
  </head>
  <body>
    <app-root>
      <!-- Message de chargement visible par défaut -->
      <div style="display:flex; justify-content:center; align-items:center; height:100vh; font-family:sans-serif; color:#666;">
        Chargement de l'application...
      </div>
    </app-root>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
